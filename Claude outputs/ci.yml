name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin ftplugin lsp tests
      - uses: lunarmodules/luacheck@v1
        with:
          args: lua plugin ftplugin lsp tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Run unit tests
        run: make test

  # Runs against a real souther-lsp. Only on tags so the default CI stays
  # JDK-free. Requires souther's Homebrew tap to resolve on the runner.
  integration:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Install souther
        run: brew install souther-lang/souther/souther
      - name: Run integration tests
        run: make test-integration
